<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — WRLD.</title>
<meta name="description" content="Choose a new password for your WRLD account.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">🔑 Reset Password</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Choose a new password</h2>
        <p style="font-size:13.5px; margin-top:6px;">Make it something you haven't used before.</p>
      </div>

      <div class="form-error" id="form-error"></div>
      <div id="expired-panel" class="hidden">
        <p class="mb-16" style="font-size:13.5px;">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn btn-primary btn-block">Request a New Link →</a>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="rp-password">New password</label>
          <input class="form-input" id="rp-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="rp-password2">Confirm new password</label>
          <input class="form-input" id="rp-password2" type="password" placeholder="Re-enter your new password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset Password →</button>
      </form>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js?v=20.6.3"></script>
<script src="data.js"></script>
<script src="orbit-knowledge.js"></script>
<script src="auth.js?v=20.6.3"></script>
<script src="app.js?v=20.6.2"></script>
<script src="orbit.js?v=16"></script>
<script>
function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

// V14 fix: this page used to gate itself on a `?token=` query parameter
// and call resetPassword(resetToken, newPassword) — leftovers from the
// pre-Supabase, localStorage-based reset scheme. Real Supabase recovery
// links don't carry a `?token=` param at all (the session comes back via
// the URL hash/`?code=`, already processed automatically by
// supabase-client.js's detectSessionInUrl:true before window.wrldAuthReady
// resolves), and resetPassword() has taken a single `newPassword`
// argument since V13. With the old code, this page ALWAYS showed
// "invalid or expired" — even for a perfectly valid reset link — because
// resetToken was always null. Rebuilt against the real flow.
let resetInFlight = false;

(async () => {
  initPage(null);

  const params = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  const errorCode = params.get('error_code') || hashParams.get('error_code');
  if(params.get('error') || hashParams.get('error')){
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('expired-panel').classList.remove('hidden');
    document.getElementById('expired-panel').querySelector('p').textContent =
      errorCode==='otp_expired' ? 'This reset link has expired — request a new one below.' : 'This reset link is invalid or has already been used.';
    return;
  }

  await window.wrldAuthReady;
  if(!isAuthenticated()){
    // No error param, but also no session — most likely a stale/reused
    // link with nothing left to exchange.
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('expired-panel').classList.remove('hidden');
    return;
  }

  document.getElementById('reset-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(resetInFlight) return;
    showFormError('');
    const p1 = document.getElementById('rp-password').value;
    const p2 = document.getElementById('rp-password2').value;
    if(p1.length < 8){ showFormError('Password must be at least 8 characters.'); return; }
    if(p1 !== p2){ showFormError('The passwords do not match. Please re-enter them.'); return; }

    const btn = document.getElementById('reset-submit');
    resetInFlight = true;
    btn.disabled = true; btn.textContent = 'Saving...';
    let result;
    try{
      result = await resetPassword(p1);
    }catch(err){
      resetInFlight = false;
      btn.disabled = false; btn.textContent = 'Reset Password →';
      showFormError("We couldn't save that right now. Please check your connection and try again.");
      return;
    }
    resetInFlight = false;
    btn.disabled = false; btn.textContent = 'Reset Password →';

    if(!result.ok){
      if(/expired|invalid/i.test(result.error||'')){
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('expired-panel').classList.remove('hidden');
      } else {
        showFormError(result.error);
      }
      return;
    }
    showToast('✅ Password updated — log in with your new password');
    setTimeout(()=>{ location.href = 'login.html'; }, 1200);
  });
})();
</script>
</body>
</html>
