<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — WRLD.</title>
<meta name="description" content="Choose a new password for your WRLD account.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">🔑 Reset Password</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Choose a new password</h2>
        <p style="font-size:13.5px; margin-top:6px;">Make it something you haven't used before.</p>
      </div>

      <div class="form-error" id="form-error"></div>
      <div id="expired-panel" class="hidden">
        <p class="mb-16" style="font-size:13.5px;">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn btn-primary btn-block">Request a New Link →</a>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="rp-password">New password</label>
          <input class="form-input" id="rp-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="rp-password2">Confirm new password</label>
          <input class="form-input" id="rp-password2" type="password" placeholder="Re-enter your new password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset Password →</button>
      </form>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="orbit.js"></script>
<script>
function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

const resetToken = new URLSearchParams(location.search).get('token');
if(!resetToken){
  document.getElementById('reset-form').classList.add('hidden');
  document.getElementById('expired-panel').classList.remove('hidden');
}

document.getElementById('reset-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  showFormError('');
  const p1 = document.getElementById('rp-password').value;
  const p2 = document.getElementById('rp-password2').value;
  if(p1 !== p2){ showFormError("Those passwords don't match — try again."); return; }

  const btn = document.getElementById('reset-submit');
  btn.disabled = true; btn.textContent = 'Saving...';
  const result = await resetPassword(resetToken, p1);
  btn.disabled = false; btn.textContent = 'Reset Password →';

  if(!result.ok){
    if(result.error && result.error.includes('expired')){
      document.getElementById('reset-form').classList.add('hidden');
      document.getElementById('expired-panel').classList.remove('hidden');
    } else {
      showFormError(result.error);
    }
    return;
  }
  showToast('✅ Password updated — log in with your new password');
  setTimeout(()=>{ location.href = 'login.html'; }, 1200);
});

initPage(null);
</script>
</body>
</html>
