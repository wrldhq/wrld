<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — WRLD.</title>
<meta name="description" content="Create your free WRLD account to save progress, track completed Playbooks, and unlock a personalized dashboard.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">🌱 Join WRLD</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Create your free account</h2>
        <p style="font-size:13.5px; margin-top:6px;">Save progress, track completed Playbooks, and make WRLD yours.</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <p class="form-hint mb-16" style="text-align:center; background:var(--sky); border-radius:var(--r-md); padding:12px 16px;">Every new WRLD account starts as an <strong>Explorer</strong> — track progress, complete Playbooks, join the community, and build your dashboard. <a href="become-mentor.html" style="color:var(--blue-dark); font-weight:700;">Want to mentor instead?</a></p>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="su-name">Full name</label>
          <input class="form-input" id="su-name" type="text" placeholder="Jordan Rivera" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="su-email">Email address</label>
          <input class="form-input" id="su-email" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="su-password">Password</label>
          <input class="form-input" id="su-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="su-password2">Confirm password</label>
          <input class="form-input" id="su-password2" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create My Account →</button>
      </form>

      <p class="text-center mt-24" style="font-size:13.5px;">Already have a WRLD account? <a href="login.html" style="font-weight:700; color:var(--blue-dark);">Log In</a></p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="orbit.js"></script>
<script>
function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

document.getElementById('signup-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  showFormError('');
  const name = document.getElementById('su-name').value;
  const email = document.getElementById('su-email').value;
  const password = document.getElementById('su-password').value;
  const password2 = document.getElementById('su-password2').value;
  if(password !== password2){ showFormError("Those passwords don't match — try again."); return; }

  const btn = document.getElementById('signup-submit');
  btn.disabled = true; btn.textContent = 'Creating your account...';
  // Every public signup becomes an Explorer — signUp() itself enforces this,
  // and this form doesn't even offer another option.
  const result = await signUp({name, email, password});
  btn.disabled = false; btn.textContent = 'Create My Account →';

  if(!result.ok){ showFormError(result.error); return; }
  const params = new URLSearchParams(location.search);
  location.href = params.get('next') || 'welcome.html';
});

initPage(null);
</script>
</body>
</html>
