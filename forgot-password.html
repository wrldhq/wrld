<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — WRLD.</title>
<meta name="description" content="Reset your WRLD account password.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">🔑 Reset Password</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Forgot your password?</h2>
        <p style="font-size:13.5px; margin-top:6px;">Enter your account email and we'll help you reset it.</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="request-form">
        <div class="form-group">
          <label class="form-label" for="fp-email">Email address</label>
          <input class="form-input" id="fp-email" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="request-submit">Send Reset Instructions →</button>
      </form>

      <div id="result-panel" class="hidden mt-16"></div>

      <p class="text-center mt-24" style="font-size:13.5px;"><a href="login.html" style="font-weight:700; color:var(--blue-dark);">← Back to Log In</a></p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="orbit.js"></script>
<script>
function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

document.getElementById('request-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  showFormError('');
  const email = document.getElementById('fp-email').value;
  const result = requestPasswordReset(email);

  document.getElementById('request-form').classList.add('hidden');
  const panel = document.getElementById('result-panel');
  panel.classList.remove('hidden');

  if(result.exists){
    panel.innerHTML = `
      <div class="form-success mb-16">✅ We found an account for ${email}.</div>
      <p style="font-size:13px; color:var(--ink-faint); margin-bottom:16px;">WRLD doesn't send real emails yet, so here's a direct link to continue — once email delivery is live, this step will happen in your inbox instead.</p>
      <a href="reset-password.html?token=${encodeURIComponent(result.token)}" class="btn btn-primary btn-block">Continue to Reset Password →</a>`;
  } else {
    panel.innerHTML = `
      <div class="form-success mb-16">If an account exists for ${email}, reset instructions have been prepared for it.</div>
      <p style="font-size:13px; color:var(--ink-faint);">Double-check the email address, or <a href="signup.html" style="font-weight:700; color:var(--blue-dark);">create a new account</a> instead.</p>`;
  }
});

initPage(null);
</script>
</body>
</html>
