<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — WRLD.</title>
<meta name="description" content="Reset your WRLD account password.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">🔑 Reset Password</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Forgot your password?</h2>
        <p style="font-size:13.5px; margin-top:6px;">Enter your account email and we'll help you reset it.</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="request-form">
        <div class="form-group">
          <label class="form-label" for="fp-email">Email address</label>
          <input class="form-input" id="fp-email" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div id="turnstile-widget" class="mb-16"></div>
        <button type="submit" class="btn btn-primary btn-block" id="request-submit">Send Reset Instructions →</button>
      </form>

      <div id="result-panel" class="hidden mt-16"></div>

      <p class="text-center mt-24" style="font-size:13.5px;"><a href="login.html" style="font-weight:700; color:var(--blue-dark);">← Back to Log In</a></p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js?v=23"></script>
<script src="data.js"></script>
<script src="orbit-knowledge.js"></script>
<script src="auth.js?v=23"></script>
<script src="app.js?v=22.1"></script>
<script src="orbit.js?v=22"></script>
<script>
function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

// CAPTCHA (V14) — same graceful no-op pattern as signup.html: only
// activates with a real Turnstile site key configured. See
// AUTH-SECURITY-SETUP.md.
if(typeof WRLD_CAPTCHA_SITE_KEY !== 'undefined' && WRLD_CAPTCHA_SITE_KEY){
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
  document.getElementById('turnstile-widget').innerHTML = `<div class="cf-turnstile" data-sitekey="${WRLD_CAPTCHA_SITE_KEY}" data-callback="wrldOnCaptchaSuccess"></div>`;
}
window.wrldOnCaptchaSuccess = function(token){ window.__wrldCaptchaToken = token; };

// V14 fix: this used to call requestPasswordReset() without awaiting it
// and read result.exists/result.token — properties that stopped existing
// once V13 moved password reset to real Supabase Auth emails
// (requestPasswordReset() has been async and returns {ok, error} since
// then). That meant this page was silently broken — the success panel
// rendered instantly with `undefined` values instead of ever sending a
// real email. Rebuilt against the real, current function signature, with
// distinct loading/duplicate-submit/error states matching signup.html.
let resetRequestInFlight = false;
document.getElementById('request-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(resetRequestInFlight) return;
  showFormError('');
  const email = document.getElementById('fp-email').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim())){ showFormError('Please enter a valid email address.'); return; }

  const btn = document.getElementById('request-submit');
  resetRequestInFlight = true;
  btn.disabled = true; btn.textContent = 'Sending…';
  let result;
  try{
    result = await requestPasswordReset(email, window.__wrldCaptchaToken);
  }catch(err){
    resetRequestInFlight = false;
    btn.disabled = false; btn.textContent = 'Send Reset Instructions →';
    showFormError("We couldn't send that right now. Please check your connection and try again.");
    return;
  }
  resetRequestInFlight = false;
  btn.disabled = false; btn.textContent = 'Send Reset Instructions →';

  if(!result.ok){ showFormError(result.error); return; }

  document.getElementById('request-form').classList.add('hidden');
  const panel = document.getElementById('result-panel');
  panel.classList.remove('hidden');
  // Never reveal whether the email is actually registered — same
  // deliberate non-disclosure Supabase's own API already applies.
  panel.innerHTML = `
    <div class="form-success mb-16">📬 If an account exists for ${escapeHtml(email)}, we've sent password reset instructions to it.</div>
    <p style="font-size:13px; color:var(--ink-faint);">Check your inbox (and spam folder) for an email from WRLD. Didn't get it? Double-check the address and try again, or <a href="signup.html" style="font-weight:700; color:var(--blue-dark);">create a new account</a> instead.</p>`;
});

initPage(null);
</script>
</body>
</html>
