<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — WRLD.</title>
<meta name="description" content="Log in to your WRLD account to pick up right where you left off.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="auth-shell">
    <div class="card auth-card reveal">
      <div class="text-center mb-24">
        <div class="eyebrow">👋 Welcome back</div>
        <h2 style="font-size:1.6rem; margin-top:8px;">Log in to WRLD</h2>
        <p style="font-size:13.5px; margin-top:6px;">Pick up right where you left off.</p>
      </div>

      <div class="form-success" id="form-success" style="display:none;"></div>
      <div class="form-error" id="form-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="li-email">Email address</label>
          <input class="form-input" id="li-email" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="li-password">Password</label>
          <input class="form-input" id="li-password" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>
        <div class="text-center mb-16" style="margin-top:-6px;">
          <a href="forgot-password.html" style="font-size:13px; font-weight:700; color:var(--blue-dark);">Forgot your password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log In →</button>
      </form>

      <p class="text-center mt-24" style="font-size:13.5px;">New to WRLD? <a href="signup.html" style="font-weight:700; color:var(--blue-dark);">Create a free account</a></p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="orbit.js?v=16"></script>
<script>
// One login for everyone — the account's real, stored role decides where
// you land. Nobody ever picks "Explorer" or "Admin" here.
// ROLE_DESTINATIONS now lives in auth.js (shared with email-verified.html)
// so the two never drift apart.

function showFormError(msg){
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

// V15.1: signup.html redirects here with ?created=1 once a new account is
// made (email verification is no longer required — see auth.js's
// "NO-VERIFICATION SIGNUP FLOW" note). Show a one-time success message
// confirming the account is ready and the user just needs to log in.
(function showSignupSuccessIfNeeded(){
  const params = new URLSearchParams(location.search);
  if(params.get('created') === '1'){
    const el = document.getElementById('form-success');
    el.textContent = 'Your WRLD account has been created. You can now log in.';
    el.style.display = 'block';
  }
})();

document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  showFormError('');
  const email = document.getElementById('li-email').value;
  const password = document.getElementById('li-password').value;

  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const result = await logIn(email, password);
  btn.disabled = false; btn.textContent = 'Log In →';

  if(!result.ok){
    if(result.needsOwnerSetup){ location.href = 'owner-setup.html'; return; }
    showFormError(result.error);
    return;
  }

  const params = new URLSearchParams(location.search);
  location.href = params.get('next') || ROLE_DESTINATIONS[result.user.role] || 'dashboard.html';
});

initPage(null);
</script>
</body>
</html>
